services:

  api1:
    build: ./api
    container_name: api1
    restart: always
    environment:
      - INSTANCE_NAME=api1

  api2:
    build: ./api
    container_name: api2
    restart: always
    environment:
      - INSTANCE_NAME=api2

  api3:
    build: ./api
    container_name: api3
    restart: always
    environment:
      - INSTANCE_NAME=api3

  lb:
    build: ./load-balancer
    container_name: lb
    ports:
      - "4000:4000"
    depends_on:
      - api1
      - api2
      - api3

  healer:
    build: ./healer
    container_name: healer
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - api1
      - api2
      - api3
